name = "droidbridge-relay"
main = "src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = true
# Custom domain: uncomment after DNS is pointed at this Worker.
# routes = [{ pattern = "droid.synqra.info", custom_domain = true }]

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "DeviceRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceRelay"]

[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "droidbridge-relay"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_Y3JlYXRpdmUtYXJhY2huaWQtOTQ4My5jbGVyay5hY2NvdW50cy5kZXYk"
